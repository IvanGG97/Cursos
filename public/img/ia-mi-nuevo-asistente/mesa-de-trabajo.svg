<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Una mesa de trabajo llena de papeles: ya no entra uno nuevo y los primeros se caen por el borde">
  <rect width="800" height="600" fill="#121826"/>

  <!-- límite de la mesa (el "tamaño" del contexto) -->
  <rect x="110" y="140" width="520" height="290" rx="6" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- tapa de la mesa -->
  <rect x="90" y="420" width="560" height="26" rx="6" fill="#edf1f7"/>
  <rect x="120" y="446" width="22" height="110" fill="#8a93a6"/>
  <rect x="598" y="446" width="22" height="110" fill="#8a93a6"/>

  <!-- pilas de papeles -->
  <g>
    <rect x="150" y="320" width="130" height="100" rx="4" fill="#232b3a"/>
    <rect x="156" y="300" width="130" height="100" rx="4" fill="#2b3446"/>
    <rect x="146" y="280" width="130" height="100" rx="4" fill="#edf1f7"/>
    <rect x="160" y="298" width="90" height="8" rx="4" fill="#8a93a6"/>
    <rect x="160" y="314" width="100" height="8" rx="4" fill="#8a93a6"/>
    <rect x="160" y="330" width="70" height="8" rx="4" fill="#8a93a6"/>
  </g>
  <g>
    <rect x="310" y="300" width="130" height="120" rx="4" fill="#232b3a"/>
    <rect x="316" y="270" width="130" height="120" rx="4" fill="#2b3446"/>
    <rect x="306" y="240" width="130" height="120" rx="4" fill="#232b3a"/>
    <rect x="312" y="210" width="130" height="120" rx="4" fill="#edf1f7"/>
    <rect x="326" y="230" width="96" height="8" rx="4" fill="#8a93a6"/>
    <rect x="326" y="246" width="80" height="8" rx="4" fill="#8a93a6"/>
    <rect x="326" y="262" width="100" height="8" rx="4" fill="#8a93a6"/>
  </g>
  <g>
    <rect x="470" y="310" width="130" height="110" rx="4" fill="#232b3a"/>
    <rect x="464" y="280" width="130" height="110" rx="4" fill="#edf1f7"/>
    <rect x="478" y="298" width="92" height="8" rx="4" fill="#8a93a6"/>
    <rect x="478" y="314" width="70" height="8" rx="4" fill="#8a93a6"/>
  </g>

  <!-- papel nuevo que no entra -->
  <g transform="rotate(10 690 200)">
    <rect x="640" y="140" width="110" height="130" rx="4" fill="#22d3ee"/>
    <rect x="654" y="160" width="80" height="8" rx="4" fill="#0b0f14" opacity=".55"/>
    <rect x="654" y="176" width="64" height="8" rx="4" fill="#0b0f14" opacity=".55"/>
    <rect x="654" y="192" width="74" height="8" rx="4" fill="#0b0f14" opacity=".55"/>
  </g>
  <path d="M640 250 C610 270 600 280 590 300" stroke="#22d3ee" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M582 286 L590 302 L606 294" stroke="#22d3ee" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- papeles viejos que se caen por el otro borde -->
  <g transform="rotate(-28 70 480)">
    <rect x="30" y="430" width="90" height="70" rx="4" fill="#8a93a6" opacity=".7"/>
  </g>
  <g transform="rotate(-50 60 540)">
    <rect x="30" y="510" width="70" height="56" rx="4" fill="#8a93a6" opacity=".45"/>
  </g>
</svg>
